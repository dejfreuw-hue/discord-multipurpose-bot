# Main configuration. Secrets (bot token, database URI, license key, API keys) go in .env, not here.
# Restart the bot after editing. If something is wrong, the bot prints exactly which line to fix.
#
# Wrap text in quotes when it contains a colon or starts with a special character like # or @.
# Discord IDs must always be in quotes: "123456789012345678"

bot:
  # Shown in /help, /botinfo and panels.
  name: "Reuw"

  # User IDs that bypass cooldowns and permission checks. Leave empty to use the
  # owner of the application in the Discord Developer Portal.
  owners: []

  # Default language for servers that haven't picked one in /setup. Must match a file in /locales.
  locale: en

  # Accent colour for panels. Servers can override it in /setup.
  color: "#5865F2"

  presence:
    # online, idle, dnd or invisible
    status: online
    # playing, listening, watching, competing, custom or none
    activity: watching
    text: "/help"

  # Optional links shown as buttons in /botinfo. Leave empty to hide them.
  supportServer: ""
  website: ""

commands:
  # Register slash commands on startup whenever they change. Turn off if you prefer
  # running "npm run commands:deploy" yourself.
  autoRegister: true

  # Register commands to one server only. Updates there are instant, which is handy while
  # testing. Leave empty to register globally (can take up to an hour to show everywhere).
  devGuildId: ""

  # Seconds a user has to wait between uses of the same command.
  defaultCooldown: 3

  # Per-command cooldowns in seconds, overriding the default. Example:
  #   cooldowns:
  #     ping: 10
  #     botinfo: 30
  cooldowns: {}

ui:
  # Use Discord's newer message layout (Components V2). Set to false for classic embeds,
  # for example if some of your users are on very old Discord clients.
  componentsV2: true

logging:
  # trace, debug, info, warn or error. Use debug when asking for support.
  level: info
  # Coloured, readable console output. Turn off when a log collector reads stdout as JSON.
  pretty: true
  # Folder for log files, relative to the bot folder. Files rotate daily and at maxSize.
  dir: logs
  retainFiles: 14
  maxSize: 10m

# Settings per module. Optional modules have "enabled: true/false" to turn them off for
# every server. Servers can also turn modules off for themselves in /setup.
modules:
  core:
    help:
      # List modules in /help even when a server has turned them off.
      showDisabled: false

  moderation:
    enabled: true
    # Hide moderation commands from members who lack the matching Discord permission
    # (Ban Members for /ban and so on). Set to false if your staff roles don't have those
    # permissions: the commands then show for everyone, and the bot only lets Discord-permission
    # holders and staff roles from /setup use them. Restart after changing.
    hideCommands: true
    # How often to check for expired temporary bans and roles, in seconds.
    expiryCheckSeconds: 30

  automod:
    # Needs the Message Content intent (Developer Portal -> Bot). Per-server filters,
    # strikes and punishments are set with /setup and /automod.
    enabled: true
    # Seconds before AutoMod's in-channel warning deletes itself. 0 keeps it.
    noticeSeconds: 6

  ai:
    # Needs the Message Content intent. API keys go in .env (OPENAI_API_KEY, ANTHROPIC_API_KEY,
    # GEMINI_API_KEY, AI_COMPAT_API_KEY). Providers without a key are simply not offered.
    enabled: true
    # Used when a server hasn't picked a provider: openai, anthropic, gemini or compatible.
    defaultProvider: anthropic
    # Models per provider. chatModel answers messages; visionModel reads images for the scam
    # scanner and must support image input. Check your provider's docs for current model names.
    providers:
      openai:
        chatModel: gpt-4.1-mini
        visionModel: gpt-4.1-mini
      anthropic:
        chatModel: claude-sonnet-5-5
        visionModel: claude-haiku-4-5-20251001
      gemini:
        chatModel: gemini-2.5-flash
        visionModel: gemini-2.5-flash
      # Any server that speaks the OpenAI Chat Completions API: OpenRouter, Groq, Together,
      # Ollama (http://localhost:11434/v1), LM Studio (http://localhost:1234/v1) and others.
      compatible:
        baseUrl: ""
        chatModel: ""
        visionModel: ""
    # Longest answer, in tokens. Thinking models (like Gemini 2.5) spend part of this on
    # reasoning, so don't set it too low.
    maxOutputTokens: 800
    timeoutSeconds: 45
    # Upper limit for any server's daily token allowance. Servers can set a lower one in
    # /ai limits. This is what protects your API bill.
    maxDailyTokens: 500000

  tickets:
    # Needs the Message Content intent (for transcripts and modmail). Panels, ticket types and
    # questions are set up per server with /tickets; the basics are in /setup.
    enabled: true
    # Most messages saved in one transcript. Longer tickets keep the newest messages.
    transcriptLimit: 5000
    # How often to look for quiet tickets to remind or close, in minutes.
    inactivityCheckMinutes: 10

  leveling:
    enabled: true
    # XP needed for each level is quadratic*level^2 + linear*level + base. The defaults give
    # 100 XP for level 1, 1,150 for level 5 and 23,850 for level 20. Changing this later moves
    # everyone's level, since levels are worked out from total XP.
    curve:
      quadratic: 5
      linear: 50
      base: 100
    # How often voice XP is handed out, in seconds. XP per minute is set per server.
    voiceTickSeconds: 60
    # Largest image members and admins can upload as a rank card background, in MB.
    maxBackgroundMB: 8

  economy:
    enabled: true
    # Slot machine symbols. weight = relative chance per reel, three/two = bet multiplier for
    # three or two matching symbols. The defaults return 94% of bets over time; the bot logs
    # the return rate of your table on startup, and /economy status shows it too. The symbols
    # themselves are set per language in locales/<lang>.json under economy.slots.symbols.
    slots:
      - { id: cherry, weight: 30, three: 6, two: 0.75 }
      - { id: lemon, weight: 25, three: 8, two: 0.75 }
      - { id: bell, weight: 20, three: 12, two: 1 }
      - { id: clover, weight: 13, three: 25, two: 1.5 }
      - { id: seven, weight: 8, three: 60, two: 2 }
      - { id: diamond, weight: 4, three: 200, two: 3 }
    # Seconds a blackjack hand waits for a move before standing automatically.
    blackjackTimeoutSeconds: 120
